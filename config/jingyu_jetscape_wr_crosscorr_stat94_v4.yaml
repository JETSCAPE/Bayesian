# JETSCAPE q-hat (arXiv:2408.08247) -- 'COMPLICATED' COVARIANCE on the paper-reproducing setup.
#   identical to jingyu_jetscape_wr_statcov_stat94_v4.yaml (tables, design, emulator, sampler) EXCEPT the covariance:
#   covariance  : per-source columns; local measurement sources (sys / correlated / shape / unfolding) 'ptgauss:0.1'
#                 per observable; 'uncorrelated' diagonal; every NORMALIZATION source (taa / luminosity / lumi_taa /
#                 norm / reference) FULLY CORRELATED ACROSS all observables of the same experiment+energy ('-1:1',
#                 15 shared groups). This is the sharing STAT never had.
#   result      : vs the STAT recipe -- alpha_s 0.384->0.390, Q0 1.67->1.80, tau0 0.47->0.48, c3 14.9->6.5 [0.4,42]
#   2026-09-24  : switched to data/20260924_curated_v4, which adds the R_AA normalization uncertainties missing
#                 from the HEPData records (see curation_audit/GLOBALS_PROVENANCE.md). Design ids 13, 15, 103
#                 are excluded so the training set stays EXACTLY STAT's 94.
#-------------------------------------------
output_dir: "/Users/zhanj82/Desktop/JetScapeSTAT/Bayesian/results/jingyu_jetscape_wr_crosscorr_stat94_v4/"

initialize_observables: True
preprocess_input_data: True
fit_emulators: False   # emulator.pkl in the results dir was fitted on THIS setup (data/20230914_curated_v3, 94 STAT ids) with random_state 20260916; set True to refit (same seed -> same optima, LML per PC [-8.43, -125.4, -70.57, -124.58] == STAT's)
run_mcmc: True
run_closure_tests: False

plot:
  input_data: True
  covariance: False
  emulators: False
  mcmc: True
  qhat: False
  closure_tests: False
  across_analyses: False

debug_level: 0

observable_table_dir: "/Users/zhanj82/Desktop/JetScapeSTAT/Bayesian/data/20260924_curated_v4/tables"   # curated data + MC, incl. the 2026-09-24 normalization fix
observable_config_dir: "/Users/zhanj82/Desktop/JetScapeSTAT/Bayesian/config"
observables_filename: "observables_preprocessed.h5"

parameters:
  preprocessing_parameters: &default_preprocessing_parameters
    filtering:
      enable: false       # QA is done by design-point exclusion instead
      method: "relative_statistical_error"
      threshold: 0.10
      problem_fraction_threshold: 0.07
      min_design_points: 50
      max_filtered_fraction: 0.6
    smoothing:
      enable: false        # QA is done by design-point exclusion instead
      outlier_n_RMS: 2.      # lower = flag more bins as statistical outliers -> interpolate
      interpolation_method: "linear"
      max_n_feature_outliers_to_interpolate: 3
    outlier_cleaning:
      method: none         # clean 20230320 tables (max R_AA 1.49) - NO cleaning needed
      max_abs: 5.0

  emulator_parameters: &default_emulator_parameters
    force_retrain: True
    random_state: 20260916   # seeds the GP hyperparameter restarts (opt-in, see sk_learn.py)
    pca_whiten: True
    kernels:
      active: ["rbf", "noise"]
      matern: {nu: 1.5, length_scale_bounds_factor: [0.01, 100]}
      rbf: {length_scale_bounds_factor: [0.01, 100]}
      constant: {constant_value: 1., constant_value_bounds: [0.001, 10]}
      noise: {type: "white", args: {noise_level: 0.25, noise_level_bounds: [1.e-8, 100]}}
    GPR: {n_restarts: 50, alpha: 0.1}
    cross_validation: False
    cross_validation_k: 5
    independent_validation: True

  mcmc_parameters: &default_mcmc_parameters
    n_walkers: 100
    n_burn_steps: 3000
    moves: de       # DEMove 0.8 + DESnookerMove 0.2 (see _full_expcorr_de): ~2x ESS along the alpha_s-Q0-tau0 ridge
    n_sampling_steps: 40000     # DE moves; 92-observable posterior mixes faster (tau~200-250 in the curated_* runs)
    n_logging_steps: 10

  closure: &default_closure_parameters
    confidence: 0.9

analysis_base: &model_base
  model_name: "MATTER+LBT"
  parameterizations: ["exponential"]
  sqrts_list: [200, 2760, 5020]
  centrality_range: [[0, 50]]
  recoil_scheme: "negative_recominber"
  parameterization:
    exponential:
      names: ['$\alpha_S^{\rm{fix}}$', "$Q_0$", "$c_1$", "$c_2$", '$\tau_0$', "$c_3$"]
      min: [0.1, 1, 0.006737946999085467, 0.006737946999085467, 0, 0.049787068367863944]
      max: [0.5, 10, 10, 10, 1.5, 100]
      log_scale_indices: [2, 3, 5]
      corner_plot_ranges: [[0.1, 0.5], [1, 10], [0, 2], [0, 2], [0, 1.5], [1, 4]]
    binomial:
      names: ['$\alpha_S^{\rm{fix}}$', "$Q_0$", "$c_1$", "$c_2$", "$a$", "$b$", '$\tau_0$']
      min: [0.1, 1, 0.006737946999085467, 0.006737946999085467, -10, -10, 0]
      max: [0.5, 10, 10, 10, 100, 100, 1.5]
  alpha: 0.2
  validation_indices: [200, 230]   # STAT's declared holdout batch
  cuts_on: center             # STAT convention: keep a bin iff its CENTRE >= 9 (edge-based dropped 20 bins STAT fitted, 709 vs 729)
  cuts:                       # pT > 9 GeV (paper's MinPT-9). Jets/chjets already start
    hadron: [9., 100000.]     # above 9 GeV, so this only trims the 189 low-pT hadron bins.
    inclusive_jet: [9., 100000.]
    inclusive_chjet: [9., 100000.]

analyses:
  # Normalization groups (taa/lumi/norm, shared by experiment + energy) are fully correlated ('-1:1').
  # All LOCAL measurement groups use the pT kernel 'ptgauss:0.1' below (NOT full correlation);
  # 'uncor' is diagonal (built-in).
  correlation_groups:
    # 'complicated' covariance (the curated_v2 treatment) on the paper-reproducing setup: per-source columns,
    # LOCAL measurement sources (sys/correlated/shape/unfolding) as ptgauss:0.1 per observable, 'uncorrelated'
    # diagonal, and every NORMALIZATION source (taa/luminosity/lumi_taa/norm/reference) FULLY CORRELATED ACROSS
    # all observables of the same experiment+energy ('-1:1'). Differs from STAT's recipe (_v3full) in exactly
    # that cross-observable sharing (STAT: diagonal blocks only; and STAT's ALICE norm at 0.1, ATLAS corr 0.2 etc.).
    default: 'ptgauss:0.1'
    taa_2760: '-1:1'
    luminosity_2760: '-1:1'
    norm_alice_2760_pi0: '-1:1'
    norm_alice_5020_pi: '-1:1'
    lumi_taa_alice_5020: '-1:1'
    lumi_taa_cms_2760: '-1:1'
    luminosity_atlas_2760: '-1:1'
    luminosity_atlas_5020: '-1:1'
    luminosity_cms_5020: '-1:1'
    norm_alice_2760: '-1:1'
    norm_alice_5020: '-1:1'
    norm_phenix_200: '-1:1'
    norm_star_200: '-1:1'
