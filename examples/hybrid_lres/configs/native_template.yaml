output_dir: OUTPUT
initialize_observables: false
preprocess_input_data: false
fit_emulators: false
run_mcmc: false
run_closure_tests: false
plot:
  input_data: true
  covariance: true
  emulators: true
  mcmc: false
  qhat: false
  closure_tests: false
  across_analyses: false
debug_level: 0
observable_table_dir: INPUTS
observable_config_dir: INPUTS
observables_filename: observables.h5
parameters:
  preprocessing_parameters:
    filtering:
      enable: false
      method: relative_statistical_error
      threshold: 0.03
      problem_fraction_threshold: 0.0
      min_design_points: 20
      max_filtered_fraction: 0.6
    smoothing:
      enable: false
      outlier_n_RMS: 5.0
      interpolation_method: linear
      max_n_feature_outliers_to_interpolate: 2
  emulator_parameters:
    force_retrain: false
    emulator_package: sk_learn
    kernels:
      active:
      - matern
      - noise
      matern:
        nu: 1.5
        length_scale_bounds_factor:
        - 0.005
        - 1000000
      noise:
        type: white
        args:
          noise_level: 0.5
          noise_level_bounds:
          - 1.0e-05
          - 100
    GPR:
      n_restarts: 8
      alpha: 1.0e-08
    cross_validation: false
    cross_validation_k: 5
    independent_validation: true
  mcmc_parameters: &id001
    n_walkers: 50
    n_burn_steps: 2000
    n_sampling_steps: 40000
    n_logging_steps: 250
    n_processes: 2
    random_seed: 20260926
  closure:
    confidence: 0.9
analysis_base:
  model_name: Lres-E-loss
  parameterizations:
  - Lres-E-loss
  sqrts_list:
  - 5020
  centrality_range:
  - - 0
    - 10
  recoil_scheme: negative_recominber
  parameterization:
    Lres-E-loss:
      names:
      - $u_{Lres}$
      - $u_{kappa}$
      min:
      - 0.0
      - 0.0
      max:
      - 1.0
      - 1.0
      physical_posterior_transform:
        unit_names:
        - u1
        - u2
        unit_labels:
        - $u_{Lres}$
        - $u_{kappa}$
        components:
        - name: Lres
          axis_scale: log
          steps:
          - kind: multiply
            value: 1.5707963267948966
          - kind: tan
          - kind: power
            value: 3.0
        - name: kappa_sc
          axis_scale: linear
          steps:
          - kind: multiply
            value: 0.3
          - kind: add
            value: 0.3
      prior:
        type: uniform_physical
        bounds:
          Lres:
          - 0.0
          - 20.0
          kappa_sc:
          - 0.3
          - 0.6
  alpha: 0.2
  validation_indices:
  - 38
  - 39
  cuts:
    hadron__pt_:
    - 10
    - 1000
analyses:
  correlation_groups:
    default: '-1:1'
    atlas_dr12_total: '-1:1.0'
    atlas_2018_taa_0_10: '-1:1.0'
